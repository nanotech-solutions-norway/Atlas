name: Validate consumer checkout contracts

on:
  pull_request:
    paths:
      - "governance/implementation/contracts/**"
      - "governance/implementation/test-vectors/**"
      - "scripts/validate_consumer_checkout_contracts.py"
      - "scripts/checkout_consent_contract.py"
      - "scripts/test_checkout_consent_contract.py"
      - "scripts/checkout_case_contract.py"
      - "scripts/test_checkout_case_contract.py"
      - ".github/workflows/validate-consumer-checkout-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "governance/implementation/contracts/**"
      - "governance/implementation/test-vectors/**"
      - "scripts/validate_consumer_checkout_contracts.py"
      - "scripts/checkout_consent_contract.py"
      - "scripts/test_checkout_consent_contract.py"
      - "scripts/checkout_case_contract.py"
      - "scripts/test_checkout_case_contract.py"
      - ".github/workflows/validate-consumer-checkout-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract-validation:
    name: Static fail-closed contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Validate schemas and negative paths
        run: python scripts/validate_consumer_checkout_contracts.py

      - name: Validate immutable synthetic consent evidence
        run: python scripts/test_checkout_consent_contract.py

      - name: Validate synthetic cancellation and prepaid invariants
        run: python scripts/test_checkout_case_contract.py

      - name: Confirm non-deployment scope
        run: |
          echo "Static validation only."
          echo "No Wix, payment, provider, entitlement, customer, deployment or production action is performed."
          echo "Atlas consumer checkout remains NO-GO."