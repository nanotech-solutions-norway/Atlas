<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas AI — Metric Count Animations</title>
  <meta name="description" content="Atlas AI metric animations for Better Grades, active users, faster work, customer satisfaction, uptime and time saving." />
  <link rel="stylesheet" href="./better-grades-73.css" />
</head>
<body>
  <main class="animation-gallery" aria-label="Atlas AI metric count animations">
    <section id="better-grades" class="metric-card metric-card--ring" aria-labelledby="better-grades-title">
      <h1 id="better-grades-title" class="sr-only">Better grades circular progress animation</h1>
      <div class="metric-visual" data-kind="ring" data-target="73" data-duration="2800" data-suffix="%">
        <svg class="progress-ring" viewBox="0 0 600 600" role="img" aria-labelledby="better-grades-ring-title better-grades-ring-desc">
          <title id="better-grades-ring-title">Circular progress indicator showing 73 percent</title>
          <desc id="better-grades-ring-desc">The blue circular bar starts at zero and fills clockwise until it reaches 73 percent, slowing down toward the end.</desc>
          <circle class="progress-track" cx="300" cy="300" r="250" pathLength="100" />
          <circle class="progress-value" cx="300" cy="300" r="250" pathLength="100" />
        </svg>
        <div class="metric-label" aria-live="polite"><span class="metric-number">0</span><span class="metric-suffix">%</span></div>
      </div>
    </section>

    <section id="active-users" class="metric-card metric-card--text" aria-labelledby="active-users-title">
      <h2 id="active-users-title" class="sr-only">Active users count animation</h2>
      <div class="metric-visual" data-kind="text" data-target="12000" data-duration="2800" data-format="compact" data-suffix="+">
        <div class="metric-label" aria-live="polite"><span class="metric-number">0</span><span class="metric-suffix">+</span></div>
      </div>
    </section>

    <section id="faster-work" class="metric-card metric-card--text" aria-labelledby="faster-work-title">
      <h2 id="faster-work-title" class="sr-only">Faster work count animation</h2>
      <div class="metric-visual" data-kind="text" data-target="3" data-duration="2800" data-format="integer" data-suffix="X">
        <div class="metric-label" aria-live="polite"><span class="metric-number">0</span><span class="metric-suffix">X</span></div>
      </div>
    </section>

    <section id="satisfied-customers" class="metric-card metric-card--ring" aria-labelledby="satisfied-customers-title">
      <h2 id="satisfied-customers-title" class="sr-only">Satisfied customers circular progress animation</h2>
      <div class="metric-visual" data-kind="ring" data-target="91" data-duration="2800" data-suffix="%">
        <svg class="progress-ring" viewBox="0 0 600 600" role="img" aria-labelledby="satisfied-customers-ring-title satisfied-customers-ring-desc">
          <title id="satisfied-customers-ring-title">Circular progress indicator showing 91 percent</title>
          <desc id="satisfied-customers-ring-desc">The blue circular bar starts at zero and fills clockwise until it reaches 91 percent, slowing down toward the end.</desc>
          <circle class="progress-track" cx="300" cy="300" r="250" pathLength="100" />
          <circle class="progress-value" cx="300" cy="300" r="250" pathLength="100" />
        </svg>
        <div class="metric-label" aria-live="polite"><span class="metric-number">0</span><span class="metric-suffix">%</span></div>
      </div>
    </section>

    <section id="time-saving" class="metric-card metric-card--ring" aria-labelledby="time-saving-title">
      <h2 id="time-saving-title" class="sr-only">Time saving circular progress animation</h2>
      <div class="metric-visual" data-kind="ring" data-target="87" data-duration="2800" data-suffix="%">
        <svg class="progress-ring" viewBox="0 0 600 600" role="img" aria-labelledby="time-saving-ring-title time-saving-ring-desc">
          <title id="time-saving-ring-title">Circular progress indicator showing 87 percent</title>
          <desc id="time-saving-ring-desc">The blue circular bar starts at zero and fills clockwise until it reaches 87 percent, slowing down toward the end.</desc>
          <circle class="progress-track" cx="300" cy="300" r="250" pathLength="100" />
          <circle class="progress-value" cx="300" cy="300" r="250" pathLength="100" />
        </svg>
        <div class="metric-label" aria-live="polite"><span class="metric-number">0</span><span class="metric-suffix">%</span></div>
      </div>
    </section>

    <section id="up-time" class="metric-card metric-card--text" aria-labelledby="up-time-title">
      <h2 id="up-time-title" class="sr-only">Uptime count animation</h2>
      <div class="metric-visual" data-kind="text" data-target="98" data-duration="2800" data-format="integer" data-suffix="%">
        <div class="metric-label" aria-live="polite"><span class="metric-number">0</span><span class="metric-suffix">%</span></div>
      </div>
    </section>

    <section id="user-satisfaction" class="metric-card metric-card--text" aria-labelledby="user-satisfaction-title">
      <h2 id="user-satisfaction-title" class="sr-only">User satisfaction count animation</h2>
      <div class="metric-visual" data-kind="text" data-target="94" data-duration="2800" data-format="integer" data-suffix="%">
        <div class="metric-label" aria-live="polite"><span class="metric-number">0</span><span class="metric-suffix">%</span></div>
      </div>
    </section>
  </main>

  <script src="./better-grades-73.js"></script>
</body>
</html>
