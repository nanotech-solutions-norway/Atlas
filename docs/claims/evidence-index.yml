source_quality_hierarchy:
  - tier: 1
    label: Atlas-owned validated evidence
    examples: pilot results, production telemetry, customer-approved case evidence, audits, signed acceptance records
    permitted_use: direct Atlas claim if measurement method, scope, date and owner are documented
  - tier: 2
    label: Official vendor / regulatory / legal sources
    examples: vendor trust portals, DPAs, SLA terms, regulator guidance, standards bodies
    permitted_use: vendor-attributed or legal-context claim only; not automatic Atlas proof
  - tier: 3
    label: Primary academic and controlled studies
    examples: peer-reviewed RCTs, controlled field studies, economic studies
    permitted_use: contextual research; no Atlas outcome claim without Atlas data
  - tier: 4
    label: Industry surveys and consulting reports
    examples: Gallup, Deloitte, IBM, Workday-style adoption/benefit reports
    permitted_use: market context only; cite sample and caveats
  - tier: 5
    label: Unverified placeholders / marketing copy
    examples: unsupported percentages, generic claims, internal placeholders without evidence
    permitted_use: not approved for external publication

external_research:
  - ref: W18
    area: productivity_quality
    evidence_type: controlled_field_context
    atlas_use: Context only. Supports the rationale that AI assistance can improve productivity/quality in defined knowledge-work tasks, not Atlas-specific outcomes.
  - ref: W19
