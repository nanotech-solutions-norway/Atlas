vendor_evidence:
  - provider: OpenAI / ChatGPT / API
    evidence_status: documented_provider_controls
    usable_claim: OpenAI documents security/privacy controls and selected certifications for relevant services.
    caveat: Applicability depends on product, tier, enterprise/portal access, contract, data-residency setting and configuration. Scale Tier SLA is only for eligible Scale Tier traffic.
  - provider: Google Gemini / Google Cloud / Workspace
    evidence_status: documented_provider_controls
    usable_claim: Google documents certifications, GDPR processing mechanisms and selected service SLAs.
    caveat: Applicability depends on product, edition, region, contract and architecture.
  - provider: Microsoft Azure / Microsoft 365
    evidence_status: documented_provider_controls
    usable_claim: Microsoft documents compliance reports and conditional availability-zone SLAs for eligible Azure services.
    caveat: Atlas must not imply it is Microsoft-certified. SLA use requires qualified service and architecture.
  - provider: GitHub
    evidence_status: documented_provider_controls
    usable_claim: GitHub provides compliance reports to eligible enterprise/organization owners.
    caveat: Access and scope depend on plan/role. GitHub status is not an Atlas SLA.
  - provider: Wix
    evidence_status: documented_provider_controls
    usable_claim: Wix publishes trust/compliance information and status dashboards.
    caveat: No formal public Wix uptime SLA found in the master review; dashboards must not be presented as contractual SLA.
  - provider: Domeneshop
    evidence_status: limited_public_vendor_evidence
    usable_claim: Domeneshop terms include a standard DPA for relevant hosting services.
    caveat: No public ISO/SOC certification or formal public SLA evidence is registered. Security-certification claims remain needs-evidence.
  - provider: AWS
    evidence_status: documented_provider_controls
    usable_claim: AWS documents compliance programs, DPA and service-specific compute SLA terms.
    caveat: Each AWS service has its own SLA; confirm service, region, architecture and contract before use as Atlas evidence.

atlas_evidence_required_before_public_claim:
  - productivity/time-saving percentage
  - fixed ROI/payback period
  - quality/accuracy improvement percentage
  - student grades/test-score/retention improvement
  - NPS/user-satisfaction/active-user counts
  - GDPR-compliant or GDPR-certified blanket claim
  - ISO/SOC-certified Atlas claim
  - fixed uptime/availability guarantee
  - data stored only in Norway or never leaves EEA
  - full secure-delivery or Managed Secure active-state claim
  - sector-specific compliance claim for healthcare, finance or public sector
