<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas AI — Better Grades 73% Animation</title>
  <meta name="description" content="Animated circular progress graphic counting from 0% to 73% for Atlas AI website use." />
  <link rel="stylesheet" href="./better-grades-73.css" />
</head>
<body>
  <main class="animation-stage" aria-label="Better grades circular progress animation">
    <section class="progress-card" aria-labelledby="progress-title">
      <h1 id="progress-title" class="sr-only">Better Grades progress indicator</h1>

      <div class="progress-visual" data-target="73" data-duration="1700">
        <svg class="progress-ring" viewBox="0 0 600 600" role="img" aria-labelledby="ring-title ring-desc">
          <title id="ring-title">Circular progress indicator showing 73 percent</title>
          <desc id="ring-desc">The blue circular bar starts at zero and fills clockwise until it reaches 73 percent.</desc>

          <circle class="progress-track" cx="300" cy="300" r="250" pathLength="100" />
          <circle class="progress-value" cx="300" cy="300" r="250" pathLength="100" />
        </svg>

        <div class="progress-label" aria-live="polite">
          <span class="progress-number">0</span><span class="progress-symbol">%</span>
        </div>
      </div>
    </section>
  </main>

  <script src="./better-grades-73.js"></script>
</body>
</html>
